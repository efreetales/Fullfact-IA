name: Gerar APK de teste
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Manter assinatura das versões de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fullfact-debug-signing-v1
      - name: Testar e gerar APK
        run: |
          node --test supabase/tests/engine.test.mjs
          gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debate-em-contexto-apk-teste
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Habilitar aceleração do Android emulado
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Conferir interface em Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/verify_android_ui.py
      - name: Guardar capturas do aplicativo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-android
          path: ui-screenshots/
          if-no-files-found: warn
      - name: Preparar APK para download direto
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk Fullfact-IA.apk
      - name: Publicar versão para baixar no celular
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fullfact-IA — teste ${{ github.run_number }}
          body: |
            Baixe o arquivo Fullfact-IA.apk abaixo e abra no celular Android.
            Versão experimental com transcrição e checagem com fontes via Gemini.
            Ativação pessoal necessária. Identificação automática de participantes e captura de outros streamings ainda não disponíveis.
          files: |
            Fullfact-IA.apk
            ui-screenshots/*.png
          fail_on_unmatched_files: true
          make_latest: true
